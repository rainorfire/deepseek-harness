# dazi-bot bundle patch: the connector plugin only. Model routes, first-run
# preferences, and the default selection stay in the user layer — the
# profile's own `cordis.patch.yml` or the home-level one — which applies after
# every bundle layer and reaches a running install without repackaging.
#
# The mcp-manager row comes from dsh-web-app, so list this bundle after it.
- insert:
    - id: dazi-bot-connectors
      name: '@dazi/dsh-dazi-bot'