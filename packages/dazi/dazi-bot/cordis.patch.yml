# dazi-bot bundle patch: the connector plugin, plus the Magpie gateway —
# the local model router at 127.0.0.1:3425 — as the model routes and the
# default selection. Credentials resolve through `apiKeyEnv`, so the key lives
# in the harness credential store or the inherited environment, never here.
#
# The mcp-manager row comes from dsh-web-app, so list this bundle after it.
- insert:
    - id: dazi-bot-connectors
      name: '@dazi/dsh-dazi-bot'

# This patch replaces the whole `llm-pi-ai` row, including `providers`. The
# plugin ships `providers` volatile and writes user edits from the Models page
# into the profile's own patch, which applies after this layer.
- id: llm-pi-ai
  config:
    providers:
      magpie:
        displayName: Magpie
        apiKeyEnv: MAGPIE_GATEWAY_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:3425/v1
        models:
          - id: group/cheap-first
            name: 到家-便宜优先 · routing group
            contextWindow: 1000000
            maxTokens: 131072
            input: [text, image]
            reasoningEfforts:
              low: low
              high: high
              max: max
          - id: auto/minimax-m2.7
            name: MiniMax-M2.7 · routing group
            contextWindow: 204800
            maxTokens: 51200
